name: Build NestBox ARM64 APK

on:
  push:
    branches:
      - bypass-process-limit-check
      - complete-original-apk-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify complete ARM64 engine APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch pinned Wayondroid source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/src
          curl --fail --location --retry 3 \
            "https://codeload.github.com/yoro1836/wayondroid/tar.gz/a45f80b1aaa463d199c9056bb8dda7c01be5ece7" \
            -o build/wayondroid.tar.gz
          tar -xzf build/wayondroid.tar.gz -C build/src
          SOURCE_ROOT="$(tar -tzf build/wayondroid.tar.gz | sed -n '1{s,/.*,,;p;}')"
          test -n "$SOURCE_ROOT"
          test -f "build/src/$SOURCE_ROOT/tawcroot/src/syscalls_fd.c"
          test -f "build/src/$SOURCE_ROOT/app/src/main/cpp/CMakeLists.txt"
          echo "WAYON_SOURCE=$GITHUB_WORKSPACE/build/src/$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "Using Wayondroid source: $SOURCE_ROOT"

      - name: Fetch checksum-verified Wayondroid runtime libraries
        run: python3 -I scripts/fetch_engines.py

      - name: Build patched ARM64 tawcroot
        run: bash scripts/build_tawcroot.sh "$WAYON_SOURCE" "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Build patched ARM64 rootless helper and guest su
        run: bash scripts/build_helper.sh "$WAYON_SOURCE" "$ANDROID_HOME"

      - name: Verify every required native library before Gradle packaging
        shell: bash
        run: |
          set -euo pipefail
          JNI="app/src/main/jniLibs/arm64-v8a"
          REQUIRED=(
            libbinderd.so
            libc++_shared.so
            libgfxstream_backend.so
            libvine_gralloc.so
            libvine_hal_service.so
            libvine_kumquat.so
            libvine_lmkd.so
            libvine_mediascan.so
            libvine_pulse.so
            libvine_runtime.so
            libvine_vk_gfxstream.so
            libvine_vold_shim.so
            libvine_wl.so
            libtawcroot.so
            libvine_helper.so
            libnbsu.so
          )
          for lib in "${REQUIRED[@]}"; do
            test -s "$JNI/$lib" || { echo "::error::Missing or empty native library: $JNI/$lib"; exit 1; }
            "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$JNI/$lib" | grep -q "AArch64" || {
              echo "::error::Not an AArch64 ELF library: $lib"; exit 1;
            }
            echo "Verified $lib ($(stat -c %s "$JNI/$lib") bytes)"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Restore original APK-only components and re-sign
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ORIGINAL="$RUNNER_TEMP/NestBox-0.4.0-original.apk"
          curl --fail --location --retry 3 \
            "https://github.com/rifatrajbd/NestBox-An-Android-Emulator-Support-Lineage-OS/releases/download/v0.4.0/NestBox-0.4.0-debug.apk" \
            -o "$ORIGINAL"
          BAKSMALI="$RUNNER_TEMP/baksmali-3.0.10-fat.jar"
          SMALI="$RUNNER_TEMP/smali-3.0.10-fat.jar"
          curl --fail --location --retry 3 \
            "https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar" -o "$BAKSMALI"
          curl --fail --location --retry 3 \
            "https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar" -o "$SMALI"
          echo "37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  $BAKSMALI" | sha256sum -c -
          echo "32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  $SMALI" | sha256sum -c -
          # Rebuild the old final DEX after removing class definitions already supplied by the current build.
          python3 -I scripts/merge_original_apk.py "$ORIGINAL" "$APK" "$BAKSMALI" "$SMALI"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" "$RUNNER_TEMP/app-aligned.apk"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/NestBox-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/NestBox-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/app-signed.apk" "$RUNNER_TEMP/app-aligned.apk"
          mv "$RUNNER_TEMP/app-signed.apk" "$APK"

      - name: Verify complete installable ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='app.nbox'" <<< "$BADGING"
          grep -Fq "sdkVersion:'29'" <<< "$BADGING"
          if unzip -Z1 "$APK" | grep -qE '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::Unexpected non-ARM64 native libraries found"
            exit 1
          fi
          REQUIRED=(
            libbinderd.so libc++_shared.so libgfxstream_backend.so
            libvine_gralloc.so libvine_hal_service.so libvine_kumquat.so
            libvine_lmkd.so libvine_mediascan.so libvine_pulse.so
            libvine_runtime.so libvine_vk_gfxstream.so libvine_vold_shim.so
            libvine_wl.so libtawcroot.so libvine_helper.so libnbsu.so
          )
          for lib in "${REQUIRED[@]}"; do
            unzip -Z1 "$APK" | grep -Fxq "lib/arm64-v8a/$lib" || {
              echo "::error::APK is missing lib/arm64-v8a/$lib"
              exit 1
            }
          done
          echo "All ${#REQUIRED[@]} required ARM64 libraries are packaged."
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NestBox-arm64-v8a-debug-complete
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
