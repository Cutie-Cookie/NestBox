name: Build NestBox ARM64 APK

on:
  push:
    branches:
      - bypass-process-limit-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify ARM64-only package
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'; then
            echo "Unexpected 32-bit ARM libraries found"
            exit 1
          fi
          echo "APK size: $(du -h "$APK" | cut -f1)"
          echo "Native libraries:"
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NestBox-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
