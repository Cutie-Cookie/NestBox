name: Build NestBox ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - complete-original-apk-diagnostics

permissions:
  contents: read

jobs:
  build:
    name: Build and verify complete ARM64 engine APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch pinned Wayondroid source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/src
          curl --fail --location --retry 3 \
            "https://codeload.github.com/yoro1836/wayondroid/tar.gz/a45f80b1aaa463d199c9056bb8dda7c01be5ece7" \
            -o build/wayondroid.tar.gz
          tar -xzf build/wayondroid.tar.gz -C build/src
          SOURCE_ROOT="$(tar -tzf build/wayondroid.tar.gz | sed -n '1{s,/.*,,;p;}')"
          test -n "$SOURCE_ROOT"
          test -f "build/src/$SOURCE_ROOT/tawcroot/src/syscalls_fd.c"
          test -f "build/src/$SOURCE_ROOT/app/src/main/cpp/CMakeLists.txt"
          echo "WAYON_SOURCE=$GITHUB_WORKSPACE/build/src/$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "Using Wayondroid source: $SOURCE_ROOT"

      - name: Install gfxstream host-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config

      - name: Fetch checksum-verified Wayondroid runtime libraries
        run: python3 -I scripts/fetch_engines.py

      - name: Build Android Vulkan host backend with directly linked Android loader fallback
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR="$WAYON_SOURCE/deps/gfxstream-patches/gfxstream"
          BUILD_SCRIPT="$WAYON_SOURCE/scripts/gpu/build-gfxstream-backend.sh"
          test -d "$PATCH_DIR"
          # Do not route this small source edit through dep_apply_patches:
          # patch(1) has repeatedly rejected an otherwise exact hunk.
          rm -f "$PATCH_DIR/04-android-vulkan-global-fallback.patch"
          cat > "$RUNNER_TEMP/patch_gfxstream.py" <<'PY'
          from pathlib import Path
          import sys

          dispatch = Path(sys.argv[1])
          s = dispatch.read_text()
          decl_marker = '#include <string.h>'
          decl = '''#include <string.h>

          #if defined(__ANDROID__)
          extern "C" VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL vkGetInstanceProcAddr(
              VkInstance instance, const char* pName);
          #endif'''
          if 'extern "C" VKAPI_ATTR PFN_vkVoidFunction VKAPI_CALL vkGetInstanceProcAddr(' not in s:
              if decl_marker not in s:
                  raise SystemExit("Vulkan header include marker not found")
              s = s.replace(decl_marker, decl, 1)

          symbol = 'out->vkGetInstanceProcAddr = (PFN_vkGetInstanceProcAddr)dlSymFunc(lib, "vkGetInstanceProcAddr");'
          linked = symbol + '''
          #if defined(__ANDROID__)
              // Force the NDK-linked Android system loader entrypoint. The
              // runtime dlsym path can resolve a non-loader ICD or miss the
              // public loader symbol in the app linker namespace.
              out->vkGetInstanceProcAddr = ::vkGetInstanceProcAddr;
          #endif'''
          if 'Force the NDK-linked Android system loader entrypoint.' not in s:
              if symbol not in s:
                  raise SystemExit("vkGetInstanceProcAddr dispatch assignment not found")
              s = s.replace(symbol, linked, 1)

          marker = "#endif" + chr(10) + "#ifdef VK_VERSION_1_1"
          addition = """    // Resolve Vulkan global commands through the Android loader's
              // linked GIPA entrypoint when they are not direct exports.
              if (out->vkGetInstanceProcAddr) {
                  if (!out->vkCreateInstance)
                      out->vkCreateInstance = (PFN_vkCreateInstance)out->vkGetInstanceProcAddr(
                          VK_NULL_HANDLE, "vkCreateInstance");
                  if (!out->vkEnumerateInstanceExtensionProperties)
                      out->vkEnumerateInstanceExtensionProperties =
                          (PFN_vkEnumerateInstanceExtensionProperties)out->vkGetInstanceProcAddr(
                              VK_NULL_HANDLE, "vkEnumerateInstanceExtensionProperties");
                  if (!out->vkEnumerateInstanceLayerProperties)
                      out->vkEnumerateInstanceLayerProperties =
                          (PFN_vkEnumerateInstanceLayerProperties)out->vkGetInstanceProcAddr(
                              VK_NULL_HANDLE, "vkEnumerateInstanceLayerProperties");
              }
          """
          if "Resolve Vulkan global commands through the Android loader's" not in s:
              if marker not in s:
                  raise SystemExit("Could not find Vulkan version boundary in gfxstream source")
              s = s.replace(marker, addition + "    #endif" + chr(10) + "#ifdef VK_VERSION_1_1", 1)
          dispatch.write_text(s)

          build = Path(sys.argv[2])
          b = build.read_text()
          old = "cpp_link_args = ['-Wl,-rpath,\\$ORIGIN']"
          new = "cpp_link_args = ['-Wl,-rpath,\\$ORIGIN', '-lvulkan']"
          if new not in b:
              if old not in b:
                  raise SystemExit("Could not find Android C++ link args in gfxstream build script")
              b = b.replace(old, new, 1)
              build.write_text(b)
          print("Linked gfxstream backend to Android libvulkan and routed global dispatch through its GIPA")
          PY
          python3 - "$BUILD_SCRIPT" "$RUNNER_TEMP/patch_gfxstream.py" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          needle = 'dep_apply_patches gfxstream "$PATCH_DIR"\n'
          insert = needle + 'python3 "' + sys.argv[2] + '" "$GFXSTREAM_DIR/host/vulkan/cereal/common/goldfish_vk_dispatch.cpp" "$BUILD_SCRIPT"\n'
          if needle not in s:
              raise SystemExit("Could not locate gfxstream patch application hook")
          p.write_text(s.replace(needle, insert, 1))
          PY
          bash "$BUILD_SCRIPT" --abi=aarch64
          SOURCE_LIB="$WAYON_SOURCE/app/src/main/jniLibs/arm64-v8a"
          TARGET_LIB="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          test -s "$SOURCE_LIB/libgfxstream_backend.so"
          test -s "$SOURCE_LIB/libc++_shared.so"
          cp -f "$SOURCE_LIB/libgfxstream_backend.so" "$TARGET_LIB/libgfxstream_backend.so"
          cp -f "$SOURCE_LIB/libc++_shared.so" "$TARGET_LIB/libc++_shared.so"
          echo "Built patched gfxstream backend: $(stat -c %s "$TARGET_LIB/libgfxstream_backend.so") bytes"

      - name: Build patched ARM64 tawcroot
        run: bash scripts/build_tawcroot.sh "$WAYON_SOURCE" "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Build patched ARM64 rootless helper and guest su
        run: bash scripts/build_helper.sh "$WAYON_SOURCE" "$ANDROID_HOME"

      - name: Verify every required native library before Gradle packaging
        shell: bash
        run: |
          set -euo pipefail
          JNI="app/src/main/jniLibs/arm64-v8a"
          REQUIRED=(
            libbinderd.so
            libc++_shared.so
            libgfxstream_backend.so
            libvine_gralloc.so
            libvine_hal_service.so
            libvine_kumquat.so
            libvine_lmkd.so
            libvine_mediascan.so
            libvine_pulse.so
            libvine_runtime.so
            libvine_vk_gfxstream.so
            libvine_vold_shim.so
            libvine_wl.so
            libtawcroot.so
            libvine_helper.so
            libnbsu.so
          )
          for lib in "${REQUIRED[@]}"; do
            test -s "$JNI/$lib" || { echo "::error::Missing or empty native library: $JNI/$lib"; exit 1; }
            "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$JNI/$lib" | grep -q "AArch64" || {
              echo "::error::Not an AArch64 ELF library: $lib"; exit 1;
            }
            echo "Verified $lib ($(stat -c %s "$JNI/$lib") bytes)"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Restore original APK-only components and re-sign
        shell: bash
        env:
          NESTBOX_KEYSTORE_BASE64: ${{ secrets.NESTBOX_KEYSTORE_BASE64 }}
          NESTBOX_KEYSTORE_PASSWORD: ${{ secrets.NESTBOX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ORIGINAL="$RUNNER_TEMP/NestBox-0.4.0-original.apk"
          curl --fail --location --retry 3 \
            "https://github.com/rifatrajbd/NestBox-An-Android-Emulator-Support-Lineage-OS/releases/download/v0.4.0/NestBox-0.4.0-debug.apk" \
            -o "$ORIGINAL"
          BAKSMALI="$RUNNER_TEMP/baksmali-3.0.10-fat.jar"
          SMALI="$RUNNER_TEMP/smali-3.0.10-fat.jar"
          curl --fail --location --retry 3 \
            "https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar" -o "$BAKSMALI"
          curl --fail --location --retry 3 \
            "https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat.jar" -o "$SMALI"
          echo "37ae4a41a8886e15c20b8362fa4250f96bbdb55e1a608199ad8b5dff068b588f  $BAKSMALI" | sha256sum -c -
          echo "32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  $SMALI" | sha256sum -c -
          python3 -I scripts/merge_original_apk.py "$ORIGINAL" "$APK" "$BAKSMALI" "$SMALI"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" "$RUNNER_TEMP/app-aligned.apk"
          : "${NESTBOX_KEYSTORE_BASE64:?Missing GitHub secret NESTBOX_KEYSTORE_BASE64}"
          : "${NESTBOX_KEYSTORE_PASSWORD:?Missing GitHub secret NESTBOX_KEYSTORE_PASSWORD}"
          printf '%s' "$NESTBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/NestBox-release.p12"
          test -s "$RUNNER_TEMP/NestBox-release.p12"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/NestBox-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias nestbox-release \
            --ks-pass env:NESTBOX_KEYSTORE_PASSWORD \
            --key-pass env:NESTBOX_KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/app-signed.apk" "$RUNNER_TEMP/app-aligned.apk"
          mv "$RUNNER_TEMP/app-signed.apk" "$APK"

      - name: Verify complete installable ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          CERTS="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")"
          grep -Fqi "1dd1cfb8846ef3ddb439c1c8b232f2c40f9075f583632cc8d8235c20c09c6bc4" <<< "$CERTS" || {
            echo "::error::APK was not signed with the permanent NestBox release key"
            echo "$CERTS"
            exit 1
          }
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -Fq "package: name='app.nbox'" <<< "$BADGING"
          grep -Fq "sdkVersion:'29'" <<< "$BADGING"
          if unzip -Z1 "$APK" | grep -qE '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::Unexpected non-ARM64 native libraries found"
            exit 1
          fi
          REQUIRED=(
            libbinderd.so libc++_shared.so libgfxstream_backend.so
            libvine_gralloc.so libvine_hal_service.so libvine_kumquat.so
            libvine_lmkd.so libvine_mediascan.so libvine_pulse.so
            libvine_runtime.so libvine_vk_gfxstream.so libvine_vold_shim.so
            libvine_wl.so libtawcroot.so libvine_helper.so libnbsu.so
          )
          for lib in "${REQUIRED[@]}"; do
            unzip -Z1 "$APK" | grep -Fxq "lib/arm64-v8a/$lib" || {
              echo "::error::APK is missing lib/arm64-v8a/$lib"
              exit 1
            }
          done
          echo "All ${#REQUIRED[@]} required ARM64 libraries are packaged."
          echo "APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: NestBox-arm64-v8a-debug-complete
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
