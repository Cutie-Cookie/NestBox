name: Android APK (AArch32 fix)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/android11-aarch32-detection
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > signing.keystore
          echo "SIGNING_STORE_FILE=$PWD/signing.keystore" >> "$GITHUB_ENV"
      - name: Fetch pinned Wayondroid engine
        run: python3 scripts/fetch_engines.py
      - name: Build rootless helper
        run: |
          mkdir -p build/src
          curl -L --fail -o build/wayondroid.tar.gz https://codeload.github.com/yoro1836/wayondroid/tar.gz/a45f80b
          tar -xzf build/wayondroid.tar.gz -C build/src
          bash scripts/build_tawcroot.sh build/src/wayondroid-a45f80b "$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build_helper.sh build/src/wayondroid-a45f80b "$ANDROID_HOME"
      - name: Build APK with original signing key
        env:
          SIGNING_STORE_FILE: ${{ env.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NestBox-android11-aarch32-fix-signed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
