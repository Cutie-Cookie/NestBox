name: Android APK (AArch32 fix)

on:
  push:
    branches:
      - fix/android11-aarch32-detection
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Restore signing key and derive alias
        env:
          KEYSTORE_B64: ${{ secrets.NESTBOX_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NESTBOX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::NESTBOX_KEYSTORE_BASE64 or NESTBOX_KEYSTORE_PASSWORD is unavailable to this workflow."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > signing.keystore
          KEY_ALIAS="$(keytool -list -v -keystore signing.keystore -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{print $2; exit}')"
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Could not read alias from keystore. Check the Base64 data and keystore password."
            exit 1
          fi
          echo "SIGNING_STORE_FILE=$PWD/signing.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Signing alias identified (name not printed)."
      - name: Fetch pinned Wayondroid engine
        run: python3 scripts/fetch_engines.py
      - name: Build rootless helper
        run: |
          mkdir -p build/src
          curl -L --fail -o build/wayondroid.tar.gz https://codeload.github.com/yoro1836/wayondroid/tar.gz/a45f80b
          tar -xzf build/wayondroid.tar.gz -C build/src
          bash scripts/build_tawcroot.sh build/src/wayondroid-a45f80b "$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build_helper.sh build/src/wayondroid-a45f80b "$ANDROID_HOME"
      - name: Build APK using repository signing key
        env:
          SIGNING_STORE_FILE: ${{ env.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.NESTBOX_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.NESTBOX_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NestBox-android11-aarch32-fix-signed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
