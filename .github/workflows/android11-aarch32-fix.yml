name: Android APK (AArch32 fix)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/android11-aarch32-detection
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Restore and validate signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing or unavailable to this workflow run."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > signing.keystore
          if ! keytool -list -keystore signing.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an invalid keystore or ANDROID_KEYSTORE_PASSWORD is incorrect. Re-encode the original .jks/.keystore file as Base64."
            exit 1
          fi
          if ! keytool -list -keystore signing.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEY_ALIAS does not exist in the restored keystore or ANDROID_KEY_PASSWORD is incorrect."
            exit 1
          fi
          echo "SIGNING_STORE_FILE=$PWD/signing.keystore" >> "$GITHUB_ENV"
      - name: Fetch pinned Wayondroid engine
        run: python3 scripts/fetch_engines.py
      - name: Build rootless helper
        run: |
          mkdir -p build/src
          curl -L --fail -o build/wayondroid.tar.gz https://codeload.github.com/yoro1836/wayondroid/tar.gz/a45f80b
          tar -xzf build/wayondroid.tar.gz -C build/src
          bash scripts/build_tawcroot.sh build/src/wayondroid-a45f80b "$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build_helper.sh build/src/wayondroid-a45f80b "$ANDROID_HOME"
      - name: Build APK with original signing key
        env:
          SIGNING_STORE_FILE: ${{ env.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NestBox-android11-aarch32-fix-signed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
